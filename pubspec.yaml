name: flutter_riverpod_template
description: A flutter boilerplate project with riverpod 2.0 containing riverpod annotations, freezed, lints, hive, easy_translations and more

 
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

 
version: 0.0.5+1

environment:
  sdk: ">=3.8.0 <4.0.0"

 
dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.5
  flutter_displaymode: ^0.6.0
  easy_localization: ^3.0.7
  ionicons: ^0.2.2
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^3.0.0
  riverpod: ^3.0.3
  dio: ^5.8.0+1
  riverpod_annotation: ^3.0.3
  freezed_annotation: ^3.0.0
  logger: ^2.5.0
  get_storage: ^2.1.1
  gap: ^3.0.1
  network_logger: ^1.0.4
  json_annotation: ^4.9.0
  go_router: ^16.2.4
  fpdart: ^1.1.0
  responsive_builder: ^0.7.0
  flex_color_scheme: ^8.4.0
  url_launcher: ^6.1.11
  intl: ^0.20.2
  stack_trace: ^1.11.0
  google_fonts: ^6.2.1
  android_id: ^0.4.0
  hive_ce: ^2.11.1
  device_info_plus: ^11.4.0
  crypto: ^3.0.6
  hive_ce_flutter: ^2.3.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  connectivity_plus: ^7.0.0
  lottie: ^2.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  geolocator: ^14.0.2
  another_telephony: ^0.4.1
  permission_handler: ^12.0.3
  image_picker: ^1.2.1
  path: ^1.9.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  firebase_storage: ^13.0.6
  cloud_firestore: ^6.1.2
  shimmer_animation: ^2.2.2+1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  google_maps_flutter: ^2.17.0
  flutter_dotenv: ^6.0.0
  firebase_database: ^12.2.0
  bcrypt: ^1.2.0
  # sqlite3_flutter_libs: ^0.6.0+eol
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_dotenv: ^6.0.0

  flutter_lints: ^6.0.0
  # The "build_runner" package provides a way to generate files using Dart code
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  riverpod_generator: ^3.0.3
  # custom_lint: ^1.0.0 
  # riverpod_lint: ^3.0.0   # ✅ Upgrade this
  freezed: ^3.0.6
  # rider: ^0.0.1
  hive_ce_generator: ^1.9.1
  # riverpod_test: ^0.1.9
  drift_dev: ^2.31.0
  change_app_package_name: ^1.5.0
 
flutter:
 
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/img/
    - assets/json/
    - .env 
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300

 